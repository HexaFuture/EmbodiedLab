# EmbodiedLab settings, read by ./embodiedlab. Put your own values in embodiedlab.conf.local (same format, not tracked
# by git, read after this file) so that this file stays as shipped; environment variables override both.

# Where instances, trials, logs, caches and the SAM3/cuRobo installation live (default: ./data).
#EMBODIEDLAB_DATA=/path/with/space/embodiedlab-data

# GPUs that run simulation environments (comma separated) and how many environments each GPU runs at once.
# One environment needs about 10 GB of GPU memory and 4 CPU cores.
#EMBODIEDLAB_GPUS=0
#EMBODIEDLAB_SLOTS_PER_GPU=1

# SAM3 and cuRobo serve the perception and planning tools of exposure level T1 (about 10 GB on one GPU).
# Set EMBODIEDLAB_SERVICES=off to run without them; T0 trials do not use them.
#EMBODIEDLAB_SERVICES=on
#EMBODIEDLAB_SERVICE_GPU=0
#SAM3_CHECKPOINT=/path/to/sam3.pt   # instead of downloading facebook/sam3 from Hugging Face
#CUDA_HOME=/usr/local/cuda          # CUDA 12.x toolkit, only used to build cuRobo

# Ports on 127.0.0.1.
#EMBODIEDLAB_CONTROLLER_PORT=18731
#EMBODIEDLAB_SAM_PORT=18114
#EMBODIEDLAB_CUROBO_PORT=18768

# Image tag built by ./embodiedlab build and used by trials.
#EMBODIEDLAB_IMAGE=embodiedlab/lab:0.1.0

# Python 3.10+ used to create the virtual environments.
#EMBODIEDLAB_PYTHON=python3

# Package and source mirrors, for networks where PyPI, download.pytorch.org or GitHub are slow.
#PIP_INDEX_URL=https://pypi.org/simple                              # also used inside ./embodiedlab build
#EMBODIEDLAB_TORCH_INDEX=https://download.pytorch.org/whl/cu128     # a PEP 503 index with the torch cu128 wheels
#EMBODIEDLAB_SAM3_REPO=https://github.com/facebookresearch/sam3.git
#EMBODIEDLAB_CUROBO_REPO=https://github.com/NVlabs/curobo.git
