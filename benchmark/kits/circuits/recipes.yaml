        input_ohm: 10000000
        rates_hz: [30, 60, 120, 240]
        record_s: [2, 60]
        max_records: 20
        display_refresh_s: 0.2
  circuit_grid_rectifier:
    runtime: circuit_grid                 # benchmark/core/circuit_grid/rectifier.py: board, AC source + bridge module, capacitor and load blocks, tray, kHz logger unit (rectifier_supply)
    layout_jitter_supported: false
    params: {}
    controls: []                          # blocks are placed by hand; the module button and the logger keys are pressed
    instruments:
      circuit_grid_logger: {tools: [export_logger], evidence: "<episode>:logger:<n>"}
    public_constants:
      objective: {mean_voltage_min_V: 8.5, ripple_pp_max_V: 0.8, final_load_ohm: 820, final_load_tolerance_pct: 3}
      circuit: {source_peak_V: 12, frequency_Hz: 50, source_resistance_ohm: 25, diode_is_A: 1.0e-8, diode_T_K: 298, diode_n_low: 1.6, diode_n_high: 2.0}
      capacitors: {nominal_uF: [100, 220, 470], tolerance_pct: 10}
      load_nominal_ohm: [150, 330, 470, 680, 820, 1000, 3300]
      load_tolerance_pct: 1
      seating: {pin_to_socket_m: 0.004, tilt_deg: 5.0, base_gap_m: 0.002, tray_xy_m: 0.02, tray_tilt_deg: 10.0}
      supply_unit: {button_travel_m: 0.009, acts_at_m: 0.004}
      voltmeter: {input_ohm: 10000000, counts: 19999, conversion_s: 0.4, ranges: ["200 mV", "2 V", "20 V"], resolution: ["0.01 mV", "0.1 mV", "1 mV"]}
