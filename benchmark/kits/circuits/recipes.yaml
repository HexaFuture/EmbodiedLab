      autorange: {up_above_counts: 19999, down_below_counts: 1800}
      logger:
        range_v: [-20.0, 20.0]
        resolution_v: 0.001
        noise_v: 0.0005
        input_ohm: 10000000
        rates_khz: [1, 2, 4, 8]
        record_s: [1, 5]
        max_records: 20
        display_refresh_s: 0.2
      integration_hz: 24000
