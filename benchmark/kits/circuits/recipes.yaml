      rs_nominal_ohm: [1000, 10000, 100000]
      rs_tolerance: 0.001
      seating: {pin_to_socket_m: 0.004, tilt_deg: 5.0, base_gap_m: 0.002, tray_xy_m: 0.02, tray_tilt_deg: 10.0}
      supply_unit: {button_travel_m: 0.009, acts_at_m: 0.004}
      voltmeter: {input_ohm: 10000000, counts: 19999, conversion_s: 0.4, ranges: ["200 mV", "2 V", "20 V"], resolution: ["0.01 mV", "0.1 mV", "1 mV"]}
      ammeter: {counts: 19999, conversion_s: 0.4, ranges: ["200 uA", "2 mA", "20 mA", "200 mA"], resolution: ["0.01 uA", "0.1 uA", "1 uA", "10 uA"], shunt_ohm: [1000, 100, 10, 1]}
      autorange: {up_above_counts: 19999, down_below_counts: 1800}
      logger:
        range_v: [-10.0, 10.0]
        resolution_v: 0.001
        noise_v: 0.0005
        input_ohm: 10000000
        rates_hz: [30, 60, 120, 240]
        record_s: [2, 60]
        max_records: 20
        display_refresh_s: 0.2
  circuit_grid_network:
    runtime: circuit_grid                 # benchmark/core/circuit_grid/network.py: board, supply, three-terminal box, blocks, switch, changeover, tray, logger unit (circuit_blackbox3)
    layout_jitter_supported: false
    params: {}
    controls: []                          # blocks are placed by hand; the supply button, the switch rocker, the changeover lever and the logger keys are pressed
    instruments:
      circuit_grid_logger: {tools: [export_logger], evidence: "<episode>:logger:<n>"}
    public_constants:
      supply: {v_set: 5.0, v_tolerance: 0.01, current_limit_a: 0.1}
      rs_nominal_ohm: [1000, 10000, 100000]
      rs_tolerance: 0.001
      seating: {pin_to_socket_m: 0.004, tilt_deg: 5.0, base_gap_m: 0.002, tray_xy_m: 0.02, tray_tilt_deg: 10.0}
      supply_unit: {button_travel_m: 0.009, acts_at_m: 0.004}
      voltmeter: {input_ohm: 10000000, counts: 19999, conversion_s: 0.4, ranges: ["200 mV", "2 V", "20 V"], resolution: ["0.01 mV", "0.1 mV", "1 mV"]}
      ammeter: {counts: 19999, conversion_s: 0.4, ranges: ["200 uA", "2 mA", "20 mA", "200 mA"], resolution: ["0.01 uA", "0.1 uA", "1 uA", "10 uA"], shunt_ohm: [1000, 100, 10, 1]}
      autorange: {up_above_counts: 19999, down_below_counts: 1800}
      logger:
        range_v: [-10.0, 10.0]
        resolution_v: 0.001
        noise_v: 0.0005
        input_ohm: 10000000
        rates_hz: [30, 60, 120, 240]
        record_s: [2, 60]
        max_records: 20
        display_refresh_s: 0.2
  circuit_grid_led:
    runtime: circuit_grid                 # benchmark/core/circuit_grid/led.py: board, supply, LED blocks, resistor blocks, tray, logger unit (led_planck)
    layout_jitter_supported: false
    params: {}
    controls: []                          # blocks are placed by hand; the supply's ON/OFF and SWEEP keys and the logger keys are pressed
    instruments:
      circuit_grid_logger: {tools: [export_logger], evidence: "<episode>:logger:<n>"}
    public_constants:
      supply: {v_set: 5.0, current_limit_a: 0.1, sweep_v_per_s: 0.25}
      leds_nm: {L1: 470, L2: 525, L3: 590, L4: 630}
      rs_nominal_ohm: [100, 330, 1000]
      rs_tolerance: 0.001
      temperature_C: 25
      glow_ma: 0.5
      seating: {pin_to_socket_m: 0.004, tilt_deg: 5.0, base_gap_m: 0.002, tray_xy_m: 0.02, tray_tilt_deg: 10.0}
      supply_unit: {button_travel_m: 0.009, acts_at_m: 0.004}
      voltmeter: {input_ohm: 10000000, counts: 19999, conversion_s: 0.4, ranges: ["200 mV", "2 V", "20 V"], resolution: ["0.01 mV", "0.1 mV", "1 mV"]}
      ammeter: {counts: 19999, conversion_s: 0.4, ranges: ["200 uA", "2 mA", "20 mA", "200 mA"], resolution: ["0.01 uA", "0.1 uA", "1 uA", "10 uA"], shunt_ohm: [1000, 100, 10, 1]}
      autorange: {up_above_counts: 19999, down_below_counts: 1800}
      logger:
        range_v: [-10.0, 10.0]
        resolution_v: 0.001
